name: Release Gozuh Binaries

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  release:
    name: Build & Publish EXE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          cd cmd/gozuh
          MAJOR=$(jq -r '.FixedFileInfo.FileVersion.Major' versioninfo.json)
          MINOR=$(jq -r '.FixedFileInfo.FileVersion.Minor' versioninfo.json)
          PATCH=$(jq -r '.FixedFileInfo.FileVersion.Patch' versioninfo.json)
          BUILD=$(jq -r '.FixedFileInfo.FileVersion.Build' versioninfo.json)
          
          # Format Tag: v1.0.0.0
          VERSION="v$MAJOR.$MINOR.$PATCH.$BUILD"
          
          echo "Detected Version: $VERSION"
          echo "GOZUH_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Install Tools
        run: |
          go mod tidy
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build Binaries
        env:
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          cd cmd/gozuh
          echo ">>> Building x64..."
          GOARCH=amd64 goversioninfo -icon=../../docs/images/icon.ico -manifest=manifest.xml
          GOARCH=amd64 go build -ldflags="-s -w" -o ../../gozuh-x64.exe .
          rm resource.syso
          echo ">>> Building x32..."
          GOARCH=386 goversioninfo -icon=../../docs/images/icon.ico -manifest=manifest.xml
          GOARCH=386 go build -ldflags="-s -w" -o ../../gozuh-x32.exe .

      - name: Check Generated Files
        run: |
          echo "Listing root directory content:"
          ls -l *.exe

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.GOZUH_VERSION }}
          name: Gozuh ${{ env.GOZUH_VERSION }}
          draft: false
          prerelease: false
          files: |
            *.exe