name: Release Gozuh Binaries

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  release:
    name: Build & Publish EXE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          cd cmd/gozuh
          MAJOR=$(jq -r '.FixedFileInfo.FileVersion.Major' versioninfo.json)
          MINOR=$(jq -r '.FixedFileInfo.FileVersion.Minor' versioninfo.json)
          PATCH=$(jq -r '.FixedFileInfo.FileVersion.Patch' versioninfo.json)
          BUILD=$(jq -r '.FixedFileInfo.FileVersion.Build' versioninfo.json)
          VERSION="v$MAJOR.$MINOR.$PATCH.$BUILD"
          echo "GOZUH_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Random AES Key
        run: |
          RANDOM_KEY=$(openssl rand -base64 32)
          echo "GENERATED_KEY=$RANDOM_KEY" >> $GITHUB_ENV

      - name: Setup Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode
          go mod tidy
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build Binaries
        env:
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          cd cmd/gozuh
          LDFLAGS="-s -w -X 'gozuh/internal/config.EncryptionKey=${{ env.GENERATED_KEY }}'"
          
          GOARCH=amd64 goversioninfo -icon=../../docs/images/icon.ico -manifest=manifest.xml
          GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../../gozuh-x64.exe .
          rm resource.syso
          
          GOARCH=386 goversioninfo -icon=../../docs/images/icon.ico -manifest=manifest.xml
          GOARCH=386 go build -ldflags="$LDFLAGS" -o ../../gozuh-x32.exe .

      - name: Generate Certificate & Sign Binaries
        run: |
          openssl req -x509 -newkey rsa:4096 -keyout gozuh.key -out gozuh.crt -sha256 -days 36500 -nodes -subj "/CN=Gozuh/O=Gozuh/C=ID"
          openssl x509 -outform der -in gozuh.crt -out GozuhSecurity.cer
          
          osslsigncode sign -certs gozuh.crt -key gozuh.key -n "Gozuh" -t http://timestamp.digicert.com -in gozuh-x64.exe -out gozuh-x64-signed.exe
          mv gozuh-x64-signed.exe gozuh-x64.exe
          
          osslsigncode sign -certs gozuh.crt -key gozuh.key -n "Gozuh" -t http://timestamp.digicert.com -in gozuh-x32.exe -out gozuh-x32-signed.exe
          mv gozuh-x32-signed.exe gozuh-x32.exe

      - name: Check Generated Files
        run: |
          ls -l *.exe *.cer

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.GOZUH_VERSION }}
          name: Gozuh ${{ env.GOZUH_VERSION }}
          draft: false
          prerelease: false
          files: |
            *.exe
            GozuhSecurity.cer